<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/songbook-editor-react/vite.svg" />
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Songbook Editor</title>
    <script>
      // Un-does 404.html's redirect: restores the real path GitHub Pages
      // couldn't serve directly, before Vue Router reads the URL.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/songbook-editor-react/assets/index-BAV9uqQi.js"></script>
    <link rel="stylesheet" crossorigin href="/songbook-editor-react/assets/index-DLdHbbJn.css">
  </head>

    <div id="app"></div>
  </body>
</html>
